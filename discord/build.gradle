plugins {
    id 'application'
}

application {
    mainClassName = 'com.naeayedea.keith.platform.discord.KeithLauncher'
}

group = 'com.naeayedea.keith.discord'
version = '4.0.0-alpha'

tasks.register('addProjectInformation') {
    group = "other"
    description = "Adds project information to JAR"

    //override some config so the local deployment runs better
    doFirst {
        ant.propertyfile(file: "./build/resources/main/application.properties") {
            entry( key: "keith.version", value: "$keithVersion")
            entry( key: "keith.project.name", value: rootProject.name)
        }
    }
}

processResources {
    finalizedBy addProjectInformation
}

dependencies {
    //keith common - the shared, platform-agnostic model. discord talks to core over HTTP, not
    //via a direct module dependency - see CoreApiClient.
    implementation project(':common')

    //HTTP client (RestClient) for calling core's API - not the full spring-boot-starter-web,
    //since this app doesn't need to host its own web server.
    implementation "org.springframework:spring-web"

    //consumes LeafEvents (session state, outbound message delivery) pushed by core over RabbitMQ
    implementation "org.springframework.boot:spring-boot-starter-amqp"

    //discord related
    implementation "net.dv8tion:JDA:6.5.0"

    implementation "com.fasterxml.jackson.datatype:jackson-datatype-joda:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"
}

bootJar {
    archiveBaseName = 'keith-discord'
    archiveVersion = ''
}
